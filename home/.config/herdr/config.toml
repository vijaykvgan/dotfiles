# herdr config, linked to ~/.config/herdr/config.toml. Only this file is
# tracked: herdr also writes logs, sockets, and session.json in that directory.
onboarding = false

[theme]
name = "vesper"
auto_switch = false

[terminal]
# Match tmux -c "#{pane_current_path}" behavior for new panes/tabs/workspaces.
new_cwd = "follow"

[keys]
# tmux-style prefix
prefix = "ctrl+b"

# --- tmux muscle memory ---
# prefix+q reloaded tmux; herdr detach was default on q — move detach to d (tmux default).
reload_config = "prefix+q"
detach = "prefix+d"

# Panes (tmux: h=stack, v=side-by-side, x=kill)
split_horizontal = "prefix+h"
split_vertical = "prefix+v"
close_pane = "prefix+x"

# Pane focus via C-M-arrows (your tmux -n bindings). Avoids Neovim <C-h/j/k/l>.
# Also bound to ctrl+shift+arrows for split-pane nav.
focus_pane_left = ["ctrl+alt+left", "ctrl+shift+left"]
focus_pane_right = ["ctrl+alt+right", "ctrl+shift+right"]
focus_pane_up = ["ctrl+alt+up", "ctrl+shift+up"]
focus_pane_down = ["ctrl+alt+down", "ctrl+shift+down"]

# Tabs / windows (tmux: c new, r rename, k kill)
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
switch_tab = "prefix+1..9"

# Workspaces ≈ tmux sessions (tmux: C new, R rename, K kill, P/N switch)
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]
switch_workspace = "alt+shift+1..9"

# Agent panel rows 1-9
focus_agent = "ctrl+1..9"

# resize_mode freed from prefix+r (now rename_tab); use mouse drag or this.
resize_mode = "prefix+e"

# Keep useful herdr defaults that don't clash.
zoom = "prefix+z"
copy_mode = "prefix+["
workspace_picker = "prefix+w"
goto = "prefix+g"
toggle_sidebar = "prefix+b"
help = "prefix+?"

# Direct alt+1..9 tab jump (your tmux M-1..9). Needs Option-as-Meta in the terminal.
# Workspaces and agents use switch_workspace / focus_agent above (cmd/super+1..9, ctrl+1..9).
[keys.indexed]
tabs = "alt"

# Swap the focused pane with its neighbor (herdr has no built-in swap action).
[[keys.command]]
key = "prefix+shift+left"
type = "shell"
command = "herdr pane swap --current --direction left"

[[keys.command]]
key = "prefix+shift+right"
type = "shell"
command = "herdr pane swap --current --direction right"

[[keys.command]]
key = "prefix+shift+up"
type = "shell"
command = "herdr pane swap --current --direction up"

[[keys.command]]
key = "prefix+shift+down"
type = "shell"
command = "herdr pane swap --current --direction down"
